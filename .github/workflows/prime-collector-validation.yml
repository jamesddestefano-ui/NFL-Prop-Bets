name: PRIME NFL Prop Collector Validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/odds_api_collect.py'
      - 'tests/test_odds_capture_boundary.py'
      - 'scripts/prime_ingest_boundary.py'
      - 'scripts/prime_ingest_persist.py'
      - 'tests/test_prime_ingest_boundary.py'
      - 'tests/test_prime_ingest_persist.py'
      - '.github/workflows/prime-collector-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-compile collector without API access
        run: python -m py_compile scripts/odds_api_collect.py
      - name: Offline boundary regression tests
        run: python -m unittest discover -s tests -p 'test_odds_capture_boundary.py' -v
      - name: Offline synthetic ingestion regression tests
        run: |
          python -m unittest discover -s tests -p 'test_prime_ingest_boundary.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_persist.py' -v
