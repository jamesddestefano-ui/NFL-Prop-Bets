name: PRIME Ingest E2E Synthetic Rehearsal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prime_ingest_boundary.py'
      - 'scripts/prime_ingest_persist.py'
      - 'scripts/prime_ingest_e2e.py'
      - 'scripts/prime_ingest_runner.py'
      - 'scripts/prime_ingest_healthcheck.py'
      - 'scripts/prime_ingest_retry.py'
      - 'scripts/prime_ingest_audit_db.py'
      - 'scripts/prime_ingest_orchestrator.py'
      - 'scripts/prime_ingest_reconcile.py'
      - 'scripts/prime_ingest_health_report.py'
      - 'scripts/prime_odds_capture_screen.py'
      - 'scripts/prime_commander_health_contract.py'
      - 'scripts/prime_commander_flight_adapter.py'
      - 'tests_support_prime.py'
      - 'tests/test_prime_ingest_runner.py'
      - 'tests/test_prime_ingest_healthcheck.py'
      - 'tests/test_prime_ingest_retry.py'
      - 'tests/test_prime_ingest_audit_db.py'
      - 'tests/test_prime_ingest_orchestrator.py'
      - 'tests/test_prime_ingest_reconcile.py'
      - 'tests/test_prime_ingest_recovery.py'
      - 'tests/test_prime_ingest_health_report.py'
      - 'tests/test_prime_odds_capture_screen.py'
      - 'tests/test_prime_commander_health_contract.py'
      - 'tests/test_prime_commander_flight_adapter.py'
      - 'tests/test_prime_ingest_stateful.py'
      - 'tests/test_prime_ingest_boundary.py'
      - 'tests/test_prime_ingest_persist.py'
      - '.github/workflows/prime-ingest-e2e-validation.yml'
permissions:
  contents: read
jobs:
  synthetic-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute offline tests
        run: |
          python -m unittest discover -s tests -p 'test_prime_ingest_boundary.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_persist.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_runner.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_healthcheck.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_retry.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_audit_db.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_orchestrator.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_reconcile.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_recovery.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_health_report.py' -v
          python -m unittest discover -s tests -p 'test_prime_odds_capture_screen.py' -v
          python -m unittest discover -s tests -p 'test_prime_commander_health_contract.py' -v
          python -m unittest discover -s tests -p 'test_prime_commander_flight_adapter.py' -v
          python -m unittest discover -s tests -p 'test_prime_ingest_stateful.py' -v
      - name: Rehearse validation, idempotency and rollback
        run: python -m scripts.prime_ingest_e2e --output artifacts/prime_ingest_e2e_audit.json
      - name: Preserve synthetic-only audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prime-ingest-synthetic-audit
          path: artifacts/prime_ingest_e2e_audit.json
          if-no-files-found: warn
          retention-days: 14
