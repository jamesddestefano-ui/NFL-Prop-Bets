name: PRIME NFL Odds API Sample
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect one NFL game prop sample
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds_api_collect.py
      - name: Commit sanitized research snapshot
        run: |
          if [ -n "$(git status --porcelain -- data/odds_api)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/odds_api
            git commit -m "Capture one NFL prop odds API sample"
            git push
          fi
