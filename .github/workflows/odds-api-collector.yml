name: PRIME NFL Odds API Sample (Manual Diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate offline collector
        run: |
          python -m py_compile scripts/odds_api_collect.py
          python -m unittest discover -s tests -p 'test_odds_capture_boundary.py' -v
      - name: Collect one NFL game for isolated diagnostic
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds_api_collect.py
      - name: Confirm capture remains runner-local
        run: echo "Raw API data is not committed, uploaded or published. Ephemeral runner data is discarded."
